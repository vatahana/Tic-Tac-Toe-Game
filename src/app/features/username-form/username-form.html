<div class="w-full h-[100vh] flex flex-row items-center justify-center" style="background-color: #192a32;">
  <div class="w-[60%] h-[75%] shadow-[-1px_1px_20px_4px_rgba(255,_255,_255,_0.05)] rounded-4xl flex flex-col items-center justify-center">
    <img src="../../../assets/image/360_F_628419033_DhXsL6BKRjAfsmunFSGKXXjnnccJddno-removebg-preview.png" class="w-50 animate-pulse">
    <h1 class="text-white text-5xl font-extrabold mb-2" style="color: #f2b237;">BLACK CYBER</h1>
    <h1 class="text-white">Please click on Start button to play with your freind</h1>
    <form [formGroup]="form" (ngSubmit)="start()" class="w-[50%] mt-5">
      <div class="space-y-12">
        <div class="sm:col-span-3">
          <div class="mt-2">
            <input 
                formControlName="username" 
                type="text" 
                name="first-name"
                placeholder="Enter your username..."
                class="block w-full rounded-lg bg-white/5 px-3 py-3 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6" />
          </div>
        </div>
      </div>

      <div class="mt-2 flex items-center justify-end gap-x-6">
        <button type="submit"
          class="rounded-lg bg-teal-500 cursor-pointer w-full py-4 text-md font-bold text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500">
          Start Playing Game
        </button>
      </div>
    </form>
  </div>
</div>
